[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexer"
version = "0.1.0"
description = "A document indexing and retrieval frame: stage contracts, config schema, and an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# indexer.core carries the contracts and MUST stay dependency-free, so that a
# project adopting the frame never inherits a transitive choice it has to undo.
# Config validation is the one place strict runtime validation earns a dependency.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Every concrete choice lives behind an extra. None are installed by default;
# the reference path (extra: `reference`) is the deliberately simple one.
reference = []
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "types-PyYAML"]
# Optional accelerator for the reference dense index: same arithmetic, vectorised.
fast = ["numpy>=1.26"]
# A dense index that is offline *and* learned: TF-IDF plus a truncated SVD.
# scipy for the sparse factorisation, numpy for everything downstream of it.
dense-svd = ["numpy>=1.26", "scipy>=1.11"]
# The production dense index. Pulls torch, so it is never a default.
dense-sentence-transformer = ["sentence-transformers>=3.0"]
# The reference reranker. Same model runtime as the line above, named separately
# because a cross-encoder and a bi-encoder are independent choices.
rerank-cross-encoder = ["sentence-transformers>=3.0"]
# Snowball stemming (Italian, English) for the lexical analyser. Pure Python;
# PyStemmer is used instead when installed, for speed. `stemmer: light` needs
# neither.
analysis = ["snowballstemmer>=2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/indexer"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["indexer"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Optional integrations are imported lazily inside their implementations, so the
# type checker cannot see them unless they are installed. Ignoring them here
# keeps `mypy --strict` meaningful for everything that is not optional.
[[tool.mypy.overrides]]
module = ["anthropic", "scipy.*", "sentence_transformers", "Stemmer", "snowballstemmer"]
ignore_missing_imports = true
