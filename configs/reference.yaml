# The reference configuration: the deliberately simple end-to-end path.
#
# Every implementation named here is chosen to be the *minimal* one that
# satisfies its contract, so that the first thing that works has no moving parts
# beyond the frame itself. Each is also a legitimate ablation baseline: nothing
# here is a placeholder to be embarrassed about, and a small corpus may never
# need more.
#
# A new project copies this file, changes the corpus path and the implementation
# names, and does not fork anything.

schema_version: 1

project:
  name: reference
  description: Minimal end-to-end path over a local document folder.

paths:
  store: ./var/index
  cache: ./var/cache
  manifests: ./var/manifests
  artifacts: ./var/artifacts

corpus:
  sources:
    - impl: filesystem
      namespace: docs
      params:
        root: ./data
        include: ["**/*.pdf", "**/*.md", "**/*.txt", "**/*.html"]
        exclude: ["**/.*", "**/node_modules/**"]

ingestion:
  parse:
    enabled: true
    # Per-document routing, not a global choice: a text-native PDF and a scan
    # want different parsers, and a real corpus holds both. First match wins.
    routes:
      - when: { media_type: "text/markdown" }
        impl: markdown
      - when: { media_type: "text/plain" }
        impl: text
    default:
      impl: text
    on_error: skip
    min_reading_order_confidence: 0.5

  segment:
    # Structure first: boundaries come from headings and block kinds.
    # max_tokens is a ceiling, not the splitting rule.
    impl: structural
    max_tokens: 512
    min_tokens: 64
    overlap_tokens: 0        # invariant 3 says context, not overlap

  enrich:
    enabled: true
    batch_size: 16
    max_concurrency: 4
    enrichers:
      # The no-model control arm. Cheap, deterministic, and the thing an LLM
      # contextualiser has to beat -- without it you cannot tell "the summary
      # helps" from "any prefix helps".
      - impl: section_prefix
        scope: unit

      # Invariant 5's supply side. Without an enricher that extracts fields the
      # structured index below is inert: the router's vocabulary is empty, every
      # numeric or temporal question is classified as prose, and the structured
      # path never fires. Nothing errors -- the questions just quietly fail.
      # The config validator warns about exactly this combination.
      #
      # Regex rather than a model because a regex gets a version string or a
      # date exactly right, and "nearly right" on a value a query will compare
      # against is worse than useless.
      - impl: regex_fields
        scope: unit
        params:
          from_metadata: [name]
          fields:
            version:
              pattern: '\b(?:version|release)\s+([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
              type: str
            release_date:
              pattern: '\b(\d{4}-\d{2}-\d{2})\b'
              type: date

      # The LLM contextualiser is added by configs/full.yaml. Keeping the
      # reference path model-free means the end-to-end path runs with no API key
      # at all, which is what makes it usable as a test fixture.

  index:
    batch_size: 128
    indexes:
      - name: lexical
        kind: lexical
        impl: bm25_memory
      - name: dense
        kind: dense
        impl: hash_embedding      # deterministic, offline, no model download
        params:
          dim: 256
      - name: fields
        kind: structured
        impl: sqlite
        params:
          path: ${paths.store}/fields.db

query:
  route:
    enabled: true
    impl: rules                   # regex + field lexicon; ~0 latency baseline
    decision_log: ${paths.store}/route-decisions.jsonl
    min_confidence: 0.0
    fallback_path: lookup
    paths:
      # Invariant 5: structured, numeric and temporal questions go straight to
      # the extracted fields and never reach vector search.
      structured:
        targets: [fields]
        step_budget: 1
      # A path may name its own reranker (`rerank: cross_encoder`), overriding
      # query.rerank for that path when reranking is on. Not set here: the
      # reference path runs offline, and a cross-encoder needs a download.
      lookup:
        targets: [lexical, dense]
        top_k: { lexical: 50, dense: 50 }
        step_budget: 1
      iterative:
        targets: [lexical, dense]
        top_k: { lexical: 30, dense: 30 }
        step_budget: 4

  retrieve:
    impl: parallel
    default_top_k: 50
    timeout_ms: 5000
    on_index_error: degrade

  fuse:
    impl: rrf
    k: 60
    weights:
      lexical: 1.0
      dense: 1.0

  rerank:
    # Off in the reference path: a cross-encoder means a model download, and the
    # reference path must run offline. configs/full.yaml turns it on, and the
    # ablation measures what it buys.
    #
    # input_top_k is the main cost dial on the query path. The 2026 evidence
    # (compute-allocation study on BRIGHT; "Drowning in Documents") puts the
    # knee near 100 for pointwise rerankers, with gains flattening or reversing
    # beyond it. 50 here keeps the offline path cheap; full.yaml uses 100.
    enabled: false
    impl: noop
    input_top_k: 50
    output_top_k: 10

cache:
  impl: filesystem
  enabled: true
  params:
    root: ${paths.cache}

accounting:
  enabled: true
  prices: {}

eval:
  golden_set: ./eval/golden.jsonl
  k_values: [1, 5, 10, 20]
  failure_k: 20
  match: span_overlap
  min_overlap: 0.5
  report_dir: ./var/eval

  # The ablation ladder. Each arm differs from the one above it in exactly the
  # listed keys, so every row of the delta table is attributable to one change.
  ablations:
    - name: dense-only
      description: One half of the hybrid. The floor.
      overrides:
        ingestion.index.indexes[lexical].enabled: false
        query.route.paths.lookup.targets: [dense]
        query.fuse.enabled: false

    - name: lexical-only
      description: The other half. BM25 alone is a stronger baseline than expected.
      overrides:
        ingestion.index.indexes[dense].enabled: false
        query.route.paths.lookup.targets: [lexical]
        query.fuse.enabled: false

    - name: hybrid-no-context
      description: Both indexes, fused, but units carry no context. Invariant 4 alone.
      overrides:
        ingestion.enrich.enabled: false

    - name: hybrid-context
      description: Adds contextualisation. Expected -1/3 on retrieval failures.
      overrides: {}

    - name: hybrid-context-rerank
      description: Adds the cross-encoder. Expected another halving.
      overrides:
        query.rerank.enabled: true
        query.rerank.impl: cross_encoder

    - name: no-router
      description: Everything takes LOOKUP. Measures what invariant 5 is worth.
      overrides:
        query.route.enabled: false

    # Two arms added in the 2026-09 evidence review. Each checks a knob the
    # literature most often finds mis-set; see docs/STATE_OF_THE_ART.md §2, §6.
    - name: hybrid-context-rrf-k20
      description: >
        RRF with k=20 instead of the published 60. Bruch, Gai & Ingber (2023)
        show RRF is sensitive to k; 60 is a prior, not a finding.
      overrides:
        query.fuse.k: 20

    - name: hybrid-context-overlap
      description: >
        64 tokens of overlap on the structural segmenter. Three independent
        2024-26 studies find overlap adds nothing once units carry context;
        this arm produces the number on this corpus.
      overrides:
        ingestion.segment.overlap_tokens: 64

  # Published expectations, asserted against this corpus. A failure here means
  # something is wired wrong -- see SanityVerdict for the usual causes.
  sanity_checks:
    - name: contextualisation cuts retrieval failures by ~1/3
      metric: retrieval_failure_rate
      baseline_arm: hybrid-no-context
      treatment_arm: hybrid-context
      expected_reduction: 0.33
      tolerance: 0.5
    - name: reranking roughly halves them again
      metric: retrieval_failure_rate
      baseline_arm: hybrid-context
      treatment_arm: hybrid-context-rerank
      expected_reduction: 0.50
      tolerance: 0.5
