# The ablation corpus: documentation from 50 PyPI packages.
#
# Built by `scripts/fetch_corpus.py`, which pins each package's version in
# `data/pypi-docs/_corpus.json` so the corpus is reproducible.
#
# Everything named here is offline: no credentials, no model downloads, runs in
# CI. See docs/REVIEW.md for what that costs -- in short, the dense index is not
# a semantic model and the reranker is not a cross-encoder, so absolute numbers
# from this config are not comparable to published figures. The deltas are the
# point.

extends: reference.yaml

project:
  name: pypi-docs
  description: Documentation from 50 PyPI packages. Heterogeneous md/rst/txt.

paths:
  store: ./var/pypi/index
  cache: ./var/pypi/cache
  manifests: ./var/pypi/manifests
  artifacts: ./var/pypi/artifacts

corpus:
  sources:
    - impl: filesystem
      namespace: pypi
      params:
        root: ./data/pypi-docs
        include: ["**/*.md", "**/*.rst", "**/*.txt"]
        max_bytes: 400000
        # The corpus encodes the package in its directory layout. That is a
        # known fact, not an inferred one, so it is lifted here rather than
        # extracted by a model that would only guess at what the path states.
        path_metadata:
          package: '^([^/]+)/'

ingestion:
  parse:
    enabled: true
    # Per-document routing, which this corpus actually needs: 550 rst files,
    # 104 markdown, 32 plain text. A single global parser would lose the
    # heading structure of whichever format it was not chosen for -- and with
    # it the section paths the segmenter and the golden set both depend on.
    routes:
      - when: { media_type: "text/x-rst" }
        impl: rst
      - when: { media_type: "text/markdown" }
        impl: markdown
      - when: { media_type: "text/plain" }
        impl: text
    default:
      impl: text
    on_error: skip

  segment:
    impl: structural
    max_tokens: 400
    min_tokens: 48
    overlap_tokens: 0

  enrich:
    enabled: true
    batch_size: 32
    enrichers:
      # Document-aware context. The offline stand-in for LLM contextualisation;
      # `configs/full.yaml` names the real one.
      - impl: extractive_context
        scope: document
        params:
          max_chars: 320
          lead_sentences: 2
          distinctive_terms: 6

      # Invariant 5's supply side. Without extracted fields a numeric or
      # temporal question has nowhere to go but the vector index.
      - impl: regex_fields
        scope: unit
        params:
          from_metadata: [package]
          fields:
            version:
              pattern: '\b(?:version|release)\s+([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
              type: str
            # A numeric field, so numeric predicates are exercised against real
            # values rather than a field invented for the demo.
            version_major:
              pattern: '\b(?:version|release)\s+([0-9]+)\.[0-9]+'
              type: int
            release_date:
              pattern: '\b(\d{4}-\d{2}-\d{2})\b'
              type: date

  index:
    batch_size: 256
    indexes:
      - name: lexical
        kind: lexical
        impl: bm25_memory
      - name: dense
        kind: dense
        impl: hash_embedding
        params:
          dim: 384
          char_ngram: 4
      - name: fields
        kind: structured
        impl: sqlite
        params:
          path: ${paths.store}/fields.db

query:
  route:
    enabled: true
    impl: rules
    decision_log: ${paths.store}/route-decisions.jsonl
    paths:
      structured:
        targets: [fields]
        step_budget: 1
      lookup:
        targets: [lexical, dense]
        top_k: { lexical: 50, dense: 50 }
        step_budget: 1
      iterative:
        targets: [lexical, dense]
        top_k: { lexical: 30, dense: 30 }
        step_budget: 3

  retrieve:
    impl: parallel
    default_top_k: 50

  fuse:
    impl: rrf
    k: 60
    weights: { lexical: 1.0, dense: 1.0 }

  rerank:
    enabled: false
    impl: lexical_overlap
    input_top_k: 50
    output_top_k: 20

eval:
  golden_set: ./data/pypi-docs-golden.jsonl
  k_values: [1, 5, 10, 20]
  failure_k: 20
  match: span_overlap
  min_overlap: 0.5
  report_dir: ./var/pypi/eval
  judge:
    impl: containment
  bootstrap:
    impl: heuristic
    params:
      target_size: 300
      min_unit_chars: 260
      detail_terms: 3
      drop_if_baseline_rank: 1
      drop_if_worse_than: 50
      structured_share: 0.18
      max_per_document: 3

  # The ladder. Each arm differs from the previous in exactly the listed keys.
  ablations:
    - name: 1-lexical-only
      description: BM25 alone, no context, no fusion, no rerank. The floor.
      overrides:
        ingestion.enrich.enabled: false
        ingestion.index.indexes[dense].enabled: false
        query.route.paths.lookup.targets: [lexical]
        query.route.paths.iterative.targets: [lexical]
        query.fuse.enabled: false

    - name: 2-dense-only
      description: Hashed dense alone. Not a semantic model -- see docs/REVIEW.md.
      overrides:
        ingestion.enrich.enabled: false
        ingestion.index.indexes[lexical].enabled: false
        query.route.paths.lookup.targets: [dense]
        query.route.paths.iterative.targets: [dense]
        query.fuse.enabled: false

    - name: 3-hybrid-rrf
      description: Both indexes fused with RRF, still no context. Invariant 4 alone.
      overrides:
        ingestion.enrich.enabled: false

    - name: 4-hybrid-sectionpath
      description: Heading trail only. The control for "does any prefix help?".
      overrides:
        # regex_fields must stay. Overrides replace lists wholesale, so dropping
        # it here would also empty the router's field lexicon and send every
        # structured question to vector search -- confounding a context arm with
        # an invariant-5 regression. The first run of this ablation made exactly
        # that mistake, and route_acc falling to 0.0 is what exposed it.
        ingestion.enrich.enrichers:
          - impl: section_prefix
            scope: unit
          - impl: regex_fields
            scope: unit
            params:
              from_metadata: [package]
              fields:
                version:
                  pattern: '\b(?:version|release)\s+([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
                  type: str
                version_major:
                  pattern: '\b(?:version|release)\s+([0-9]+)\.[0-9]+'
                  type: int
                release_date:
                  pattern: '\b(\d{4}-\d{2}-\d{2})\b'
                  type: date

    - name: 5-hybrid-context
      description: Adds document-aware context. Invariant 3's arm.
      overrides: {}

    - name: 6-hybrid-context-rerank
      description: Adds the reranker. Invariant 3's second number.
      overrides:
        query.rerank.enabled: true

    # --- diagnostic arms -------------------------------------------------
    # Added after the first run, where two published expectations failed to
    # reproduce. Each encodes one hypothesis about why, so the explanation is
    # measured rather than asserted.

    - name: 3b-hybrid-rerank
      description: >-
        No context, reranking on. The missing cell of the context x rerank 2x2:
        without it, comparing a context arm that reranks against a no-context arm
        that does not attributes the difference to the wrong stage.
      overrides:
        ingestion.enrich.enabled: false
        query.rerank.enabled: true

    - name: 9-hybrid-weighted
      description: >-
        Hypothesis: equal RRF weights let a weak dense half outvote a strong
        lexical one. If so, down-weighting dense should recover hybrid past
        lexical-only.
      overrides:
        query.rerank.enabled: true
        query.fuse.weights: { lexical: 1.0, dense: 0.25 }

    - name: 10-context-lean
      description: >-
        Hypothesis: the context hurts because it is ~76% identical across a
        document's units -- dilution, not signal. Dropping the document-level
        parts leaves only chunk-specific context (subject + section path).
      overrides:
        query.rerank.enabled: true
        ingestion.enrich.enrichers:
          - impl: extractive_context
            scope: document
            params:
              max_chars: 120
              lead_sentences: 0      # identical for every unit in a document
              distinctive_terms: 0   # likewise
              include_section_path: true
          - impl: regex_fields
            scope: unit
            params:
              from_metadata: [package]
              fields:
                version:
                  pattern: '\b(?:version|release)\s+([0-9]+\.[0-9]+(?:\.[0-9]+)?)'
                  type: str
                version_major:
                  pattern: '\b(?:version|release)\s+([0-9]+)\.[0-9]+'
                  type: int
                release_date:
                  pattern: '\b(\d{4}-\d{2}-\d{2})\b'
                  type: date

    - name: 7-no-router
      description: Everything takes LOOKUP. Measures what invariant 5 is worth.
      overrides:
        query.rerank.enabled: true
        query.route.enabled: false

    - name: 8-fixed-window
      description: Fixed 400-token windows instead of structure. The chunking control.
      overrides:
        query.rerank.enabled: true
        ingestion.segment.impl: fixed_window
        ingestion.segment.params: { window_tokens: 400, overlap_tokens: 64 }

  sanity_checks:
    # As originally written: verbose document-level context against no context,
    # both without reranking. Kept, and expected to fail, because the failure is
    # the finding -- see docs/ABLATION.md. Deleting a check that caught something
    # would be deleting the evidence.
    - name: contextualisation cuts retrieval failures by ~1/3 (verbose context)
      metric: retrieval_failure_rate
      baseline_arm: 3-hybrid-rrf
      treatment_arm: 5-hybrid-context
      expected_reduction: 0.33
      tolerance: 0.5

    # The same question asked correctly: chunk-specific context, and holding
    # reranking constant so the comparison isolates one stage.
    - name: contextualisation cuts retrieval failures by ~1/3 (chunk-specific)
      metric: retrieval_failure_rate
      baseline_arm: 3b-hybrid-rerank
      treatment_arm: 10-context-lean
      expected_reduction: 0.33
      tolerance: 0.5

    - name: reranking roughly halves them again
      metric: retrieval_failure_rate
      baseline_arm: 5-hybrid-context
      treatment_arm: 6-hybrid-context-rerank
      expected_reduction: 0.50
      tolerance: 0.5
