# A production-shaped configuration, as an overlay on the reference path.
#
# This file exists to demonstrate the claim: everything below is a config
# change. No implementation named here requires a frame edit to introduce --
# each registers itself and is resolved by name, and `indexer check` resolves
# every one of them (it used to name five that did not exist, and say OK).
#
# Nothing here is a recommendation for your corpus. These are the reference
# starting points from the brief, and each is expected to be replaced once the
# ablation table on a real corpus says something different. For an Italian
# company archive, start from configs/it-enterprise.yaml instead.

extends: reference.yaml

project:
  name: full
  description: Hybrid retrieval with LLM contextualisation, extraction and reranking.

corpus:
  sources:
    - impl: filesystem
      namespace: docs
      params:
        root: ./data
        include: ["**/*.pdf", "**/*.docx", "**/*.md", "**/*.html"]

ingestion:
  parse:
    routes:
      # Classify per document. A text-native PDF is an order of magnitude
      # cheaper to parse than a scan and there is no reason to pay scan prices
      # for the 80% of a corpus that does not need it.
      - when: { media_type: "application/pdf", text_layer: true }
        impl: pymupdf4llm
      - when: { media_type: "application/pdf", text_layer: false }
        impl: docling              # layout-aware, self-hosted, slower
        params:
          ocr: true
      - when: { media_type: "application/pdf", complexity: high }
        impl: llamaparse           # managed API; complex tables and scans
        params:
          api_key: ${env:LLAMAPARSE_API_KEY}
      - when: { media_type: "text/markdown" }
        impl: markdown
    default:
      impl: pymupdf4llm

  enrich:
    enabled: true
    # Units per model call, and calls in flight per batch. The first call of a
    # batch goes alone, so the others read the prompt cache it wrote.
    batch_size: 24
    max_concurrency: 8
    # A refused or failed enrichment indexes the unit without it, and the next
    # build retries only what failed.
    on_error: skip
    enrichers:
      # Invariant 3. A small fast model over the parent document: per-unit calls
      # with the document as a cached prefix when it is long enough to cache
      # (4,096 tokens on Haiku 4.5), one call per batch when it is not.
      #
      # Document-scoped: any edit to the parent invalidates every unit's
      # context. That is the honest cost of document-level context, and it is
      # stated here rather than discovered during a rebuild.
      - impl: llm_contextualizer
        scope: document
        params:
          model: claude-haiku-4-5
          prompt_cache: true
          target_tokens: 75        # the 50-100 band from the published numbers
          max_tokens: 160

      # What each document is. One call per document, labels as fields.
      - impl: llm_classifier
        scope: document
        params:
          model: claude-haiku-4-5
          labels:
            doc_type: [contract, amendment, invoice, policy, correspondence, other]

      # Invariant 5. Extracted fields are what the structured path answers from;
      # without them a numeric or temporal question has nowhere to go but the
      # vector index. Every value must be quoted from the document, or it goes
      # to review (`indexer review`) instead of the index.
      - impl: llm_field_extractor
        scope: document
        params:
          model: claude-haiku-4-5
          locale: en
          date_order: mdy
          schemas:
            contract:
              effective_date: { type: date }
              expiry_date: { type: date }
              contract_value: { type: float }
              currency: { type: str }
              counterparty: { type: str }
              governing_law: { type: str }
            invoice:
              invoice_number: { type: str }
              invoice_date: { type: date }
              total_amount: { type: float }
              currency: { type: str }
              counterparty: { type: str }

  index:
    indexes:
      - name: lexical
        kind: lexical
        impl: bm25              # SPLADE-v3 where the extra cost is earned
      - name: dense
        kind: dense
        # A real bi-encoder: `impl: sentence_transformer` needs only the
        # `dense-sentence-transformer` extra, and is the same store the
        # reference path uses with its embedder swapped. For a corpus that is
        # not English, `multilingual_embedding` (bge-m3, multilingual-e5).
        impl: sentence_transformer
        params:
          model: BAAI/bge-large-en-v1.5
          # BGE is trained with an asymmetric query instruction and measurably
          # loses quality without it. E5 wants "query: " / "passage: " instead;
          # a symmetric model wants both empty.
          query_prefix: "Represent this sentence for searching relevant passages: "
          document_prefix: ""
          batch_size: 32
          device: ${env:EMBED_DEVICE:cpu}
          # Matryoshka-capable models let the leading slice stand alone as a
          # valid embedding, so two-stage search stays available without
          # re-embedding the corpus later. Choosing a non-Matryoshka model is a
          # decision that costs a full re-index to undo.
          # truncate_dim: 256

        # The *storage* seam is a separate decision from the model above, and a
        # later one. Search here is exact brute-force cosine, which is the
        # accuracy ceiling; an ANN store trades some of it for latency that only
        # starts to matter past roughly a hundred thousand vectors. Until then
        # the win is the embedder, not the database.
      - name: fields
        kind: structured
        impl: sqlite
        params:
          path: ${paths.store}/fields.db
      # A fourth kind -- a visual (ColPali-style) index over page images -- is
      # a registration away: adding one touches no other index and no frame
      # code. None ships yet, so none is named here: a config must not name an
      # implementation that does not exist, even disabled.

query:
  route:
    # The rules router decides the questions it can read, at zero latency; the
    # model routes the paraphrases and follow-ups, and every route it writes
    # is checked against the corpus's fields before it is used.
    impl: llm
    params:
      model: claude-haiku-4-5
      strategy: rules_signals
    min_confidence: 0.6
    fallback_path: lookup
    paths:
      structured:
        targets: [fields]
      lookup:
        targets: [lexical, dense]
        top_k: { lexical: 50, dense: 50 }
        step_budget: 1
        # Cross-encoder, not an LLM. The majority of traffic takes this path and
        # an LLM reranker here spends the latency budget on the queries that
        # least need it.
        rerank: cross_encoder
      iterative:
        targets: [lexical, dense]
        top_k: { lexical: 30, dense: 30 }
        step_budget: 4
        rerank: cross_encoder

  fuse:
    impl: rrf
    k: 60
    weights:
      lexical: 1.0
      dense: 1.0

  rerank:
    enabled: true
    impl: cross_encoder
    params:
      model: BAAI/bge-reranker-v2-m3
    input_top_k: 50
    output_top_k: 10

accounting:
  enabled: true
  # USD per million tokens. Cache reads default to a tenth of input and
  # five-minute cache writes to 1.25x.
  prices:
    claude-haiku-4-5: { input_per_mtok: 1.0, output_per_mtok: 5.0 }

eval:
  judge:
    # Exact comparison for numbers, dates and booleans: cheaper, deterministic,
    # and strictly more reliable than asking a model whether two dates match.
    impl: exact
    params:
      exact_types: [number, date, boolean]
  bootstrap:
    impl: llm_bootstrap
    params:
      model: claude-haiku-4-5
      target_size: 300
      # A fifth of the set asks structured questions, so the router is
      # measurable; the rest are paraphrased away from the passage's wording.
      structured_share: 0.2
      # Items a cheap lexical baseline already ranks first measure nothing.
      drop_if_baseline_rank: 1
